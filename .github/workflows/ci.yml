name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ---- PyTorch (CPU) ----
      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch==2.2.2+cpu --index-url https://download.pytorch.org/whl/cpu

      # ---- PyG wheels (собраны под torch 2.2 CPU) + torch-geometric ----
      - name: Install PyG wheels and torch-geometric
        run: |
          pip install \
            pyg-lib \
            torch-scatter \
            torch-sparse \
            torch-cluster \
            torch-spline-conv \
            -f https://data.pyg.org/whl/torch-2.2.0+cpu.html
          pip install torch-geometric==2.4.0

      - name: Install project deps
        run: |
          pip install -r requirements.txt

      # ---- Строгий линт (с исключениями для легаси/вендор) ----
      - name: Lint (ruff/black/isort)
        run: |
          # пути/файлы, которые не хотим линтить (портированный код и артефакты)
          EXCL='(notebooks|data|results|src/graph2vec_legacy|src/third_party|src/skipgram\.py)'

          # ruff: исключаем легаси и глушим E741 только в src/utils.py
          ruff check . \
            --extend-exclude "$EXCL" \
            --per-file-ignores "src/utils.py:E741"

          # black: те же исключения
          black --check . --extend-exclude "$EXCL"

          # isort: те же исключения
          isort --check-only . \
            --skip-glob "notebooks/**" \
            --skip-glob "data/**" \
            --skip-glob "results/**" \
            --skip-glob "src/graph2vec_legacy/**" \
            --skip-glob "src/third_party/**" \
            --skip "src/skipgram.py"

      - name: Tests
        run: pytest -q
