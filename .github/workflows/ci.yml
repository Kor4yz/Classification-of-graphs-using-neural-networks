name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ---------- PyTorch (CPU) ----------
      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch==2.2.2+cpu --index-url https://download.pytorch.org/whl/cpu

      # ---------- PyG wheels + torch-geometric ----------
      - name: Install PyG wheels and torch-geometric
        run: |
          pip install \
            pyg-lib \
            torch-scatter \
            torch-sparse \
            torch-cluster \
            torch-spline-conv \
            -f https://data.pyg.org/whl/torch-2.2.0+cpu.html
          pip install torch-geometric==2.4.0

      - name: Install project deps
        run: |
          pip install -r requirements.txt

      # ---------- МЯГКИЙ автофикс и линт ----------
      # Линт создаёт аннотации, но НЕ роняет пайплайн (continue-on-error).
      - name: Lint (ruff/black/isort) — soft
        continue-on-error: true
        run: |
          # исключаем легаси и артефакты
          EXCL='(notebooks|data|results|src/graph2vec_legacy|src/third_party|src/skipgram\.py)'

          echo "== Ruff autofix (не роняет сборку) =="
          ruff check . \
            --extend-exclude "$EXCL" \
            --per-file-ignores "src/utils.py:E401,E741;src/train_utils.py:F401" \
            --fix --unsafe-fixes || true

          echo "== Black format (soft) =="
          black . --extend-exclude "$EXCL" || true

          echo "== isort format (soft) =="
          isort . \
            --skip-glob "notebooks/**" \
            --skip-glob "data/**" \
            --skip-glob "results/**" \
            --skip-glob "src/graph2vec_legacy/**" \
            --skip-glob "src/third_party/**" \
            --skip "src/skipgram.py" || true

          echo "== Ruff verify (soft) =="
          ruff check . \
            --extend-exclude "$EXCL" \
            --per-file-ignores "src/utils.py:E401,E741;src/train_utils.py:F401" || true

          echo "== Black/isort verify (soft) =="
          black --check . --extend-exclude "$EXCL" || true
          isort --check-only . \
            --skip-glob "notebooks/**" \
            --skip-glob "data/**" \
            --skip-glob "results/**" \
            --skip-glob "src/graph2vec_legacy/**" \
            --skip-glob "src/third_party/**" \
            --skip "src/skipgram.py" || true

      # ---------- Тесты ----------
      - name: Tests
        run: pytest -q
