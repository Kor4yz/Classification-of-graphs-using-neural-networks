name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      # ВАЖНО: корень репозитория, чтобы импорты вида `from src...` работали
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ---------- pin numpy < 2.0 для совместимости с torch 2.2 ----------
      - name: Create constraints
        run: echo "numpy<2.0.0" > constraints.txt

      - name: Upgrade base tools
        run: python -m pip install --upgrade pip setuptools wheel

      # ---------- PyTorch (CPU) ----------
      - name: Install PyTorch (CPU)
        run: |
          pip install torch==2.2.2+cpu \
            --index-url https://download.pytorch.org/whl/cpu \
            -c constraints.txt

      # ---------- PyG wheels + torch-geometric ----------
      - name: Install PyG wheels and torch-geometric
        run: |
          pip install \
            pyg-lib \
            torch-scatter \
            torch-sparse \
            torch-cluster \
            torch-spline-conv \
            -f https://data.pyg.org/whl/torch-2.2.0+cpu.html \
            -c constraints.txt
          pip install torch-geometric==2.4.0 -c constraints.txt

      - name: Install project deps (respect constraints)
        run: pip install -r requirements.txt -c constraints.txt

      # ---------- Линт (soft: не роняет сборку) ----------
      - name: Lint (ruff/black/isort) — soft
        continue-on-error: true
        run: |
          EXCL='(notebooks|data|results|src/graph2vec_legacy|src/third_party|src/skipgram\.py)'
          ruff check . \
            --extend-exclude "$EXCL" \
            --per-file-ignores "src/utils.py:E401,E741;src/train_utils.py:F401" \
            --fix --unsafe-fixes || true
          black . --extend-exclude "$EXCL" || true
          isort . \
            --skip-glob "notebooks/**" \
            --skip-glob "data/**" \
            --skip-glob "results/**" \
            --skip-glob "src/graph2vec_legacy/**" \
            --skip-glob "src/third_party/**" \
            --skip "src/skipgram.py" || true
          # verify (soft)
          ruff check . \
            --extend-exclude "$EXCL" \
            --per-file-ignores "src/utils.py:E401,E741;src/train_utils.py:F401" || true
          black --check . --extend-exclude "$EXCL" || true
          isort --check-only . \
            --skip-glob "notebooks/**" \
            --skip-glob "data/**" \
            --skip-glob "results/**" \
            --skip-glob "src/graph2vec_legacy/**" \
            --skip-glob "src/third_party/**" \
            --skip "src/skipgram.py" || true

      # ---------- Тесты ----------
      - name: Tests
        run: |
          echo "PYTHONPATH=$PYTHONPATH"
          python -c "import sys, pprint; pprint.pprint(sys.path[:5])"
          pytest -q -ra
