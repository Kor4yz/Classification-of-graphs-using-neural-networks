name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ---- PyTorch + PyG (CPU) ----
      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch==2.2.2+cpu torchvision==0.17.2+cpu torchaudio==2.2.2+cpu \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install PyG wheels (CPU) and torch-geometric
        run: |
          pip install pyg-lib torch-scatter torch-sparse torch-cluster torch-spline-conv \
            -f https://data.pyg.org/whl/torch-2.2.0+cpu.html
          pip install torch-geometric==2.4.0

      - name: Install project deps
        run: |
          pip install -r requirements.txt

      # ---- Автофикс стиля ----
      - name: Autofix formatting (ruff/black/isort)
        run: |
          # Игнорируем E741 временно, чтобы не падать на именах вроде 'l'
          ruff check . --fix --unsafe-fixes --ignore E741
          black .
          isort .

      - name: Ensure working tree is clean after autofix
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git diff --quiet; then
            echo "There are unformatted changes. Please run: ruff --fix, black, isort locally and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      # ---- Строгая проверка (без фиксов) ----
      - name: Lint (verify)
        run: |
          ruff check . --ignore E741
          black --check .
          isort --check-only .

      - name: Tests
        run: pytest -q
