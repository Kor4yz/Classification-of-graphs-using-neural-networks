name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install PyTorch (CPU) first
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # фиксированная версия CPU-колёс PyTorch
          pip install \
            torch==2.2.2+cpu \
            torchvision==0.17.2+cpu \
            torchaudio==2.2.2+cpu \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install PyG wheels (CPU) and torch-geometric
        run: |
          # колёса PyG, собранные под torch 2.2.x (CPU)
          pip install \
            pyg-lib \
            torch-scatter \
            torch-sparse \
            torch-cluster \
            torch-spline-conv \
            -f https://data.pyg.org/whl/torch-2.2.0+cpu.html
          pip install torch-geometric==2.4.0

      - name: Install project deps
        run: |
          # остальные зависимости проекта
          pip install -r requirements.txt

      - name: Lint
        run: |
          ruff check .
          black --check .
          isort --check-only .

      - name: Tests
        run: pytest -q
